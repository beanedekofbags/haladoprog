<!DOCTYPE html>
<html>
<head>
    <title>Főoldal</title>
    <link rel="stylesheet" href="static/css/main.css"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div id="container">
        <form id="upload-form">
            <div class="row centered" id="img-list-box">
            </div>
            <div class="row centered">
                <input name="img-desc" id="img-desc" type="text" placeholder="Írj ide leírást...">
            </div>
            <hr>
            <div class="row centered">
                <p id="txt-error">Valamilyen hibaüzenet</p>
            </div>
            <div class="row centered">
                <div class="col" id="submit-container">
                    <div id="loading">
                        <div class="throbber-container">
                            <div class="circle"></div>
                        </div>
                    </div>
                    <input type="submit" id="form-submit" value="Beküldés">
                </div>
            </div>
        </form>
        
        <div>
            <div class="row centered">
                <div id="btn-results-wrapper"></div>
            </div>
            <div class="row centered">
                <div id="results-box">
                    <div id="results-content">
                        <h2>Eredmények</h2>
                        <div class="row centered" id="results-img-wrapper"></div>
                        <p id="txt-result"></p>
                    </div>
                </div>
            </div>
        </div>
        
    </div>
    
    <script type="module" src="static/js/main.js"></script>
</body>
</html>
